<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI EduTech - Question Paper & Tutor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 700px;
            width: 90%;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 30px;
            color: #333;
        }
        .rocket {
            font-size: 3rem;
            margin-right: 10px;
        }
        .btn {
            display: block;
            width: 280px;
            margin: 15px auto;
            padding: 14px 20px;
            font-size: 1.1rem;
            text-decoration: none;
            color: white;
            background: #667eea;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #5a67d8;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-secondary {
            background: #764ba2;
        }
        .btn-secondary:hover {
            background: #6b3e91;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span class="rocket">🚀</span>
            GenAI-Powered Automatic Question Paper & Personalized Tutor
        </h1>
        
        <a href="/generate_paper" class="btn">Generate Question Paper</a>
        <a href="/tutor" class="btn btn-secondary">Talk to Personalized Tutor</a>
    </div>
</body>
</html>
