<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Scraper Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: #ffffff;
            width: 420px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            max-height: 220px;
            overflow-y: auto;
        }

        .email {
            background: #eef3ff;
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .loading {
            color: gray;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Website Email Scraper</h2>

    <input type="text" id="url" placeholder="https://example.com">
    <button onclick="scrape()">Extract Emails</button>

    <div class="result" id="result"></div>
</div>

<script>
async function scrape() {
    const url = document.getElementById("url").value;
    const result = document.getElementById("result");

    if (!url) {
        alert("Please URL enter karo");
        return;
    }

    result.innerHTML = "<p class='loading'>Scraping emails...</p>";

    try {
        const response = await fetch("http://127.0.0.1:5000/scrape", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ url: url })
        });

        const data = await response.json();
        result.innerHTML = "";

        if (data.emails && data.emails.length > 0) {
            data.emails.forEach(email => {
                const div = document.createElement("div");
                div.className = "email";
                div.textContent = email;
                result.appendChild(div);
            });
        } else {
            result.innerHTML = "<p>No emails found.</p>";
        }

    } catch (error) {
        result.innerHTML = "<p style='color:red'>Server error</p>";
    }
}
</script>

</body>
</html>
