<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Face Profiling (MediaPipe)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Face Profiling (Without dlib)</h1>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="image" accept="image/*" required>
            <button type="submit">Analyze Face</button>
        </form>

        {% if result %}
            <p class="result">{{ result }}</p>
        {% endif %}

        {% if image %}
            <img src="{{ url_for('outputs', filename=image) }}" class="output">
        {% endif %}
    </div>
</body>
</html>
